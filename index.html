<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="theme-switch">
      <span class="theme-switch-icon">🌙</span>
      <label class="switch" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-toggle" />
        <span class="slider"></span>
      </label>
      <span class="theme-switch-icon">☀️</span>
    </div>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <p class="overlay-heading">RÉCORDS</p>

        <div class="records-stats">
          <div class="records-stat">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="best-combo-value">0</span>
          </div>
          <div class="records-stat">
            <span class="label">MAX LÍNEAS</span>
            <span class="value" id="max-lines-value">0</span>
          </div>
        </div>

        <table class="highscore-table" id="start-highscore-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Puntos</th></tr>
          </thead>
          <tbody></tbody>
        </table>

        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn" class="secondary-btn">Resetear records</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-entry" class="hidden">
          <p class="new-record-label">¡Nuevo récord! Ingresa tu nombre:</p>
          <input type="text" id="name-input" maxlength="12" placeholder="Nombre" autocomplete="off" />
          <button id="save-name-btn">Guardar</button>
        </div>

        <table class="highscore-table" id="gameover-highscore-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Puntos</th></tr>
          </thead>
          <tbody></tbody>
        </table>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
